[package]
name = "noema-desktop"
version = "0.3.1"
description = "Noema desktop host"
authors = ["Yanzhen Yu"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "noema_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
arboard = "3.6.1"
base64 = "0.22.1"
dirs = "6.0.0"
mime_guess = "2.0.5"
open = "5.3.2"
png = "0.18.0"
rfd = "0.15.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-shell = "2.3.3"
url = "2.5.7"
