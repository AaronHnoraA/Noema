<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CM6 perf POC</title>
    <style>
      body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
      #toolbar { padding: 8px 12px; background: #f0f0f0; border-bottom: 1px solid #ccc; font-size: 13px; display: flex; gap: 16px; align-items: center; flex-shrink: 0; }
      #toolbar button { padding: 4px 10px; cursor: pointer; }
      #metrics { font-family: monospace; font-size: 12px; color: #333; }
      #editor-container { flex: 1; overflow: hidden; }
      .cm-editor { height: 100%; }
      .cm-scroller { overflow: auto; height: 100%; }
      .syntax-hidden { display: none; }
      .syntax-hint { color: #aaa; }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <button id="btn-load">Load meeting.md</button>
      <span id="metrics">—</span>
    </div>
    <div id="editor-container"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
